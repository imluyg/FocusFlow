[package]
name = "focusflow-core"
version.workspace = true
edition.workspace = true
license.workspace = true

# 只在开发期存在：把「测试用的临时程序目录」助手暴露给 tests/ 下的集成测试。
# 集成测试链接的是不带 cfg(test) 的库，拿不到 #[cfg(test)] 项；用特征开关 shared
# 一份实现，免得每个测试文件各自复制一份、各自漏掉清理。正常构建（含发布）不开启，
# 不会把这些代码打进产物。
[features]
test-utils = []

[dev-dependencies]
focusflow-core = { path = ".", features = ["test-utils"] }

[dependencies]
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json = "1"
anyhow.workspace = true

# SQLite（bundled 编译，无需系统库）
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

# 开机自启（Windows 注册表/启动文件夹）
winreg = "0.56"

# 键鼠全局监听
rdev = "0.5"

# Lua 脚本（插件系统）
mlua = { version = "0.10", features = ["lua54", "vendored"] }

# 截图的 PNG 编码。只用编码器，不引 image 那种全家桶。
# 版本已在依赖图里（经 tray-icon/muda 传递），加直接依赖不引入新的 crate 集合。
png = "0.18"

# 前台应用统计（仅用窗口 API + 进程快照，不对其他进程开句柄）
# 设备维度统计用 Raw Input（Win32_UI_Input_KeyboardAndMouse）
# 截图（capture 模块）用 Gdi 取屏、DataExchange/Memory 写 CF_DIB 剪贴板、
# HiDpi 核对进程 DPI 感知（坐标模型成立的前提）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

[lints]
workspace = true
