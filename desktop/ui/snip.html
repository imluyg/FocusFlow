<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>FocusFlow 截图</title>
  <style>
    /* 覆盖层是"盖住一块屏"的窗口：整屏就是这张页面，不做任何滚动与选中。
       窗口不带透明（原因见 snip.rs 的 ensure_overlay），所以在底图画出来之前
       用实心近黑兜住 —— 这恰好也是"屏幕已冻结"该有的观感。 */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0b0d;
      -webkit-user-select: none;
      user-select: none;
      cursor: crosshair;
      font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    /* 冻结的整屏底图：铺满视口，物理像素与 CSS 像素的比例由 devicePixelRatio 给出 */
    #shot {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      -webkit-user-drag: none;
      user-drag: none;
      pointer-events: none;
    }
    /* 选区外的压暗：用一层巨大的 box-shadow 实现，比再画四个遮罩块少四次布局 */
    #sel {
      position: fixed;
      display: none;
      border: 1px solid #ff8a00;
      box-sizing: border-box;
      box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }
    /* 未开始拖框时整屏压暗，让"已经冻结了"这件事一眼可见 */
    body:not(.dragging) #sel { display: none; }
    /* 鼠标停在某个窗口上时的吸附轮廓：亮着 = 这一下点下去选中整个窗口；
       不亮 = 这一下点下去是取消。颜色与选区橙错开，免得看成已经框好的选区。 */
    #snap {
      position: fixed;
      display: none;
      border: 2px solid #4ea1ff;
      box-sizing: border-box;
      background: rgba(78, 161, 255, 0.08);
      pointer-events: none;
    }
    #veil {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }
    body.has-sel #veil { display: none; }
    /* 有高亮候选时也揭开压暗：不然"要点的是哪一块"看不清楚 */
    body.has-snap #veil { display: none; }
    #size {
      position: fixed;
      display: none;
      padding: 2px 6px;
      font-size: 12px;
      line-height: 1.4;
      color: #fff;
      background: rgba(0, 0, 0, 0.72);
      border-radius: 4px;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      white-space: nowrap;
    }
    #hint {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      padding: 6px 12px;
      font-size: 13px;
      color: #fff;
      background: rgba(20, 20, 20, 0.82);
      border-radius: 6px;
      pointer-events: none;
      white-space: nowrap;
    }
    /* 出错时换成红底：截图是全屏手势，提示必须盖在同一层里才看得见 */
    #hint.error { background: rgba(150, 32, 32, 0.92); }
    /* 标注层：位图尺寸就是**物理像素**（与 Rust 裁出来的那块 1:1），CSS 尺寸除回 dpr。
       两件事不能反：位图若按 CSS 尺寸建，提交时要么重采样要么尺寸对不上（Rust 那边是
       严格相等才合，不等就报错）。pointer-events 关掉 —— 手势一律由 document 上的
       监听接，画布只做像素。 */
    #annot {
      position: fixed;
      display: none;
      pointer-events: none;
    }
    body.annotating #annot { display: block; }
    /* 工具条：必须能点（标注态会把整屏冻住盖住，鼠标党不能只靠 Enter/Esc） */
    #tools {
      position: fixed;
      display: none;
      gap: 4px;
      padding: 5px;
      background: rgba(20, 20, 20, 0.92);
      border-radius: 6px;
      z-index: 6;
    }
    body.annotating #tools { display: flex; }
    #tools button {
      padding: 3px 9px;
      font-size: 12px;
      line-height: 1.5;
      color: #eee;
      background: #232329;
      border: 1px solid #4a4a52;
      border-radius: 4px;
      cursor: pointer;
    }
    #tools button.on { border-color: #ff8a00; background: #3a2a12; }
    #tools .sep { width: 1px; background: #4a4a52; margin: 0 3px; }
    /* 标注态下把选区边框换成"正在编辑"的样子，并让光标在选区内保持十字 */
    body.annotating #sel { border-color: #4ea1ff; cursor: crosshair; }
    /* 文字笔的输入框：它就是"这一笔会画成什么样"的实时预览（不另画一层近似预览，
       那会变成两套字体渲染互相不一致）。字号按 dpr 放大，才与落到像素上的那一格同大小。 */
    #txt {
      position: fixed;
      display: none;
      margin: 0;
      padding: 0 2px;
      color: #ff2d2d;
      background: rgba(0, 0, 0, 0.35);
      border: 1px dashed #ff8a00;
      border-radius: 2px;
      font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
      line-height: 1.1;
      z-index: 7;
      outline: none;
    }
    body.typing #txt { display: block; }
  </style>
</head>
<body>
  <img id="shot" alt="" />
  <div id="veil"></div>
  <div id="snap"></div>
  <div id="sel"></div>
  <canvas id="annot"></canvas>
  <input id="txt" type="text" autocomplete="off" spellcheck="false" />
  <div id="tools">
    <button id="t-rect" data-tool="rect">矩形框</button>
    <button id="t-arrow" data-tool="arrow">箭头</button>
    <button id="t-pen" data-tool="pen">画笔</button>
    <button id="t-text" data-tool="text">文字</button>
    <button id="t-mosaic" data-tool="mosaic">马赛克</button>
    <span class="sep"></span>
    <button id="c-red" data-color="#ff2d2d">红</button>
    <button id="c-yellow" data-color="#ffd400">黄</button>
    <span class="sep"></span>
    <button id="w-thin" data-w="3">细</button>
    <button id="w-fat" data-w="7">粗</button>
    <span class="sep"></span>
    <button id="s-small" data-size="18">小</button>
    <button id="s-mid" data-size="30">中</button>
    <button id="s-big" data-size="48">大</button>
    <span class="sep"></span>
    <button id="t-undo">撤销</button>
    <button id="t-ok">完成</button>
    <button id="t-cancel">取消</button>
  </div>
  <div id="size"></div>
  <div id="hint">拖框自由选区 · 单击选中整个窗口 · Esc / 右键取消</div>
  <script type="module" src="snip.js"></script>
</body>
</html>
