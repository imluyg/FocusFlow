<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusFlow - 效率追踪器</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- 顶栏 -->
    <div class="card nav">
      <div style="display:flex;align-items:center;">
        <span class="brand">FocusFlow</span>
        <span class="sub">效率追踪器</span>
      </div>
    </div>

    <!-- 统计卡片 -->
    <div class="card">
      <div class="tabs" id="period-tabs">
        <span style="color:var(--muted);font-size:13px;">统计周期</span>
        <button class="tab active" data-period="-1">今日</button>
        <button class="tab" data-period="7">7天</button>
        <button class="tab" data-period="15">15天</button>
        <button class="tab" data-period="30">30天</button>
        <button class="tab" data-period="365">1年</button>
        <button class="tab" data-period="0">总计</button>
      </div>
      <div class="stat-cards" style="margin-top:10px;">
        <div class="stat-card"><div class="label">今日活跃</div><div class="value" id="st-today">0</div><div class="label" id="st-active">时长 0秒</div></div>
        <div class="stat-card"><div class="label">当前速度</div><div class="value" id="st-cpm">0 次/分</div></div>
        <div class="stat-card"><div class="label" id="st-total-label">周期总数</div><div class="value" id="st-total">0</div></div>
        <div class="stat-card"><div class="label" id="st-avg-label">日均</div><div class="value" id="st-avg">0</div></div>
        <div class="stat-card"><div class="label" id="st-max-label">最高单日</div><div class="value" id="st-max">0</div><div class="label" id="st-max-date"></div></div>
      </div>
    </div>

    <!-- 视图切换 -->
    <div class="card view-tabs">
      <div class="tabs" id="view-tabs">
        <button class="tab active" data-view="rank">键鼠排行</button>
        <button class="tab" data-view="apps">应用排行</button>
        <button class="tab" data-view="group">分组统计</button>
        <button class="tab" data-view="trend">趋势图</button>
        <button class="tab" data-view="hourly">小时分布</button>
        <button class="tab" data-view="weekday">星期分布</button>
        <button class="tab" data-view="plugins">插件管理</button>
        <button class="tab" data-view="settings">设置</button>
      </div>
    </div>

    <!-- 内容区 -->
    <div class="card" style="min-height:320px;">
      <div id="view-rank"></div>
      <div id="view-apps" style="display:none;"></div>
      <div id="view-group" style="display:none;"></div>
      <div id="view-trend" style="display:none;">
        <div class="tabs" id="trend-days">
          <button class="tab active" data-days="7">近7天</button>
          <button class="tab" data-days="30">近30天</button>
        </div>
        <div id="trend-chart" style="height:300px;margin-top:8px;"></div>
      </div>
      <div id="view-hourly" style="display:none;">
        <div id="hourly-chart" style="height:300px;margin-top:8px;"></div>
      </div>
      <div id="view-weekday" style="display:none;">
        <div id="weekday-chart" style="height:300px;margin-top:8px;"></div>
      </div>
      <div id="view-plugins" style="display:none;"></div>
      <div id="view-settings" style="display:none;"></div>
    </div>

    <div id="version"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
