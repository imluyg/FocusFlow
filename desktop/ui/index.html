<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusFlow - 效率追踪器</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- 顶栏 -->
    <div class="card nav">
      <div style="display:flex;align-items:center;">
        <span class="brand">FocusFlow</span>
        <span class="sub">效率追踪器</span>
      </div>
    </div>

    <!-- 统计卡片 -->
    <div class="card">
      <div class="tabs" id="period-tabs" role="tablist" aria-label="统计周期">
        <span style="color:var(--muted);font-size:13px;">统计周期</span>
        <button class="tab active" data-period="-1" role="tab" aria-selected="true">今日</button>
        <button class="tab" data-period="7" role="tab" aria-selected="false">7天</button>
        <button class="tab" data-period="15" role="tab" aria-selected="false">15天</button>
        <button class="tab" data-period="30" role="tab" aria-selected="false">30天</button>
        <button class="tab" data-period="365" role="tab" aria-selected="false">1年</button>
        <button class="tab" data-period="0" role="tab" aria-selected="false">总计</button>
      </div>
      <div class="stat-cards" style="margin-top:10px;">
        <div class="stat-card"><div class="label">今日活跃</div><div class="value" id="st-today">0</div><div class="label" id="st-active">时长 0秒</div></div>
        <div class="stat-card"><div class="label">当前速度</div><div class="value" id="st-cpm">0 次/分</div></div>
        <div class="stat-card"><div class="label" id="st-total-label">总计</div><div class="value" id="st-total">0</div></div>
        <div class="stat-card"><div class="label" id="st-avg-label">日均</div><div class="value" id="st-avg">0</div></div>
        <div class="stat-card"><div class="label" id="st-max-label">最高单日</div><div class="value" id="st-max">0</div><div class="label" id="st-max-date"></div></div>
      </div>
    </div>

    <!-- 视图切换 -->
    <div class="card view-tabs">
      <div class="tabs" id="view-tabs" role="tablist" aria-label="视图">
        <button class="tab active" data-view="rank" role="tab" aria-selected="true">键鼠排行</button>
        <button class="tab" data-view="apps" role="tab" aria-selected="false">应用排行</button>
        <button class="tab" data-view="devices" role="tab" aria-selected="false">设备排行</button>
        <button class="tab" data-view="analytics" role="tab" aria-selected="false">活跃分析</button>
        <button class="tab" data-view="plugins" role="tab" aria-selected="false">插件管理</button>
        <button class="tab" data-view="settings" role="tab" aria-selected="false">设置</button>
      </div>
    </div>

    <!-- 内容区 -->
    <div class="card" style="min-height:320px;">
      <div id="view-rank"></div>
      <div id="view-apps" style="display:none;"></div>
      <div id="view-devices" style="display:none;"></div>
      <!-- 活跃分析：页内三视图切换，数据窗口各自固定（见各图标题） -->
      <div id="view-analytics" style="display:none;">
        <div id="goal-strip"></div>
        <div class="tabs" id="analytics-tabs" role="tablist" aria-label="分析视图" style="margin-bottom:10px;">
          <button class="tab active" data-at="trend" role="tab" aria-selected="true">趋势图</button>
          <button class="tab" data-at="hourly" role="tab" aria-selected="false">小时分布</button>
          <button class="tab" data-at="weekday" role="tab" aria-selected="false">星期分布</button>
          <button class="tab" data-at="heat" role="tab" aria-selected="false">键盘热力</button>
        </div>
        <div id="ana-trend">
          <div class="tabs" id="trend-days" role="tablist" aria-label="趋势窗口">
            <span style="color:var(--muted);font-size:13px;">窗口</span>
            <button class="tab active" data-days="7" role="tab" aria-selected="true">近7天</button>
            <button class="tab" data-days="30" role="tab" aria-selected="false">近30天</button>
          </div>
          <div id="trend-chart" style="height:300px;margin-top:8px;"></div>
        </div>
        <div id="ana-hourly" style="display:none;">
          <div id="hourly-chart" style="height:300px;"></div>
        </div>
        <div id="ana-weekday" style="display:none;">
          <div id="weekday-chart" style="height:300px;"></div>
        </div>
        <div id="ana-heat" style="display:none;">
          <div style="color:var(--muted);font-size:13px;margin-bottom:6px;">
            按键热度随顶部统计周期联动；未排在前列的键与不认识的键名显示在下方「其它按键」。
          </div>
          <div id="key-heat" style="height:360px;"></div>
        </div>
      </div>
      <div id="view-plugins" style="display:none;"></div>
      <div id="view-settings" style="display:none;"></div>
    </div>

    <div id="version"></div>
  </div>

  <!-- 设备详情弹窗（点「设备排行」某一行打开） -->
  <div class="modal-overlay" id="device-modal" data-act="device-detail-overlay">
    <div class="modal-dialog" style="width:min(520px,94vw);">
      <div class="modal-head">
        <span>设备详情</span>
        <button class="tab" data-act="device-detail-close">关闭</button>
      </div>
      <div id="device-modal-body"></div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
