[package]
name = "focusflow-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# default-features = false 的唯一目的：摘掉 tauri 默认开的 `common-controls-v6`。
# 那条 feature 会把 muda 的消息框实现（`comctl32!TaskDialogIndirect`，只有 Common-Controls
# v6 才导出）变成**每个产物的静态导入**，而本仓从没调用过消息框。带着它意味着：任何拿不到
# 应用清单的产物（`tauri-build` 只把清单挂给 [[bin]]）在完整链接后加载即死
# STATUS_ENTRYPOINT_NOT_FOUND —— 桌面 lib 单元测试就是这么起不来的。
# 其余四项就是 tauri default 里除 common-controls-v6 之外的全部（x11/dbus 是 Linux 后端，
# 本包只出 Windows，故不列）。
tauri = { version = "2", default-features = false, features = [
    "tray-icon",
    "wry",
    "compression",
    "dynamic-acl",
] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
# 截图底图走 base64 data URL 送到覆盖层（见 snip.rs）。版本已在依赖图里（tauri 自己就用），
# 加直接依赖不引入新的 crate 集合。
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
# 系统级窗口材质（Win11 Mica / Win10 Acrylic，液态玻璃）
window-vibrancy = "0.5"

# 原生文件对话框（导入旧数据/导出报告）
rfd = "0.15"

focusflow-core = { path = "../crates/core" }
serde.workspace = true
serde_json = "1"
tracing.workspace = true
chrono.workspace = true
anyhow.workspace = true

[dev-dependencies]
# 单元测试里的「隔离临时程序目录」助手（paths::test_app_dir / TestAppDir）挂在 core 的
# test-utils 特征上，只对 dev 构建打开：发布构建里那些代码不存在（与 core 自己的
# dev-dependency 同一套路）。
focusflow-core = { path = "../crates/core", features = ["test-utils"] }

[lints]
workspace = true
