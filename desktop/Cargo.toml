[package]
name = "focusflow-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
# 系统级窗口材质（Win11 Mica / Win10 Acrylic，液态玻璃）
window-vibrancy = "0.5"

# 原生文件对话框（导入旧数据/导出报告）
rfd = "0.15"

focusflow-core = { path = "../crates/core" }
serde.workspace = true
serde_json = "1"
tracing.workspace = true
chrono.workspace = true
anyhow.workspace = true

[dev-dependencies]
# 单元测试里的「隔离临时程序目录」助手（paths::test_app_dir / TestAppDir）挂在 core 的
# test-utils 特征上，只对 dev 构建打开：发布构建里那些代码不存在（与 core 自己的
# dev-dependency 同一套路）。
focusflow-core = { path = "../crates/core", features = ["test-utils"] }

[lints]
workspace = true
